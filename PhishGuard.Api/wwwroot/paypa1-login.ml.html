<!DOCTYPE html>
<html>
<head>
    <title>PayPa1 Secure Login</title>
</head>
<body style="font-family: Arial; max-width: 600px; margin: 40px auto;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/PayPal_logo_2014.svg/800px-PayPal_logo_2014.svg.png" width="150">
    <h2>Sign in to your PayPa1 account</h2>
    <form>
        <input type="email" placeholder="Email or mobile number" style="width:100%; padding:10px; margin:10px 0;"><br>
        <input type="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;"><br>
        <button type="submit" style="background:#ffc439; border:none; padding:12px; width:100%;">Log In</button>
    </form>
</body>
</html>
