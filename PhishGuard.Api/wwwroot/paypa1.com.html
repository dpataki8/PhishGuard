<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to your PayPal account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            padding: 32px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

            .logo img {
                height: 40px;
            }

        h1 {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

            input:focus {
                outline: none;
                border-color: #0070ba;
                box-shadow: 0 0 0 2px rgba(0,112,186,0.2);
            }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ffc439;
            color: #333;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

            .btn:hover {
                background: #ffb600;
            }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .disclaimer {
            background: #e8f4fd;
            border-left: 4px solid #0070ba;
            padding: 12px;
            margin-top: 24px;
            font-size: 11px;
            color: #2c3e50;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/PayPal_logo_2014.svg/800px-PayPal_logo_2014.svg.png" alt="PayPal" onerror="this.style.display='none'">
        </div>
        <h1>Log in to your PayPal account</h1>

        <form>
            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="name@domain.com" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" autocomplete="off">
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>

        <div class="footer">
            <p>Having trouble logging in?</p>
        </div>

        <div class="disclaimer">
            <strong>Research Simulation Only:</strong> This page is part of a BSc Cyber Security dissertation at Anglia Ruskin University. It demonstrates phishing detection capabilities. No credentials are captured.
        </div>
    </div>
</body>
</html>
