<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      font-size: 14px;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #1a237e;
    }
    .status {
      color: #2e7d32;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin: 12px 0;
    }
    button:hover {
      background: #1565c0;
    }
    button:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }
    #result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .phishing {
      background: #ffebee;
      border-left: 4px solid #f44336;
      color: #c62828;
    }
    .safe {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      color: #2e7d32;
    }
    .error {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      color: #e65100;
    }
  </style>
</head>
<body>
  <h3>PhishGuard</h3>
  <p class="status">✅ Active</p>
  <p>Real-time phishing detection with ML-powered explainability.</p>
  
  <button id="testBtn">🔍 Test Detection</button>
  
  <div id="result" style="display:none;"></div>

  <small>Research prototype • ML.NET + XAI</small>

  <script src="popup.js"></script>
</body>
</html>
